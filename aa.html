<!DOCTYPE html>
<html lang="ko">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>test</title>
</head>

<body>
   <script>
      let num = prompt('숫자를 입력 하세요.');

      if (num != null) {
         num = Number(num);
         if (num % 4 === 0) {
            alert('4의 배수 입니다.');
         }
         else {
            alert('4의 배수가 아닙니다.');
         }
      }
      else {
         alert('입력이 취소 되었습니다.');
      }










   </script>
</body>

</html>
