<!DOCTYPE html>
<html lang="ko">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>1111</title>
</head>
<body>
   <script>
      let i = 1;
      let sum = 0 ;
      let sum_0 = 0;
      while(i <= 3){
         for(let j = 1; j <= 5 ; j++ ){
            if(j % 2 == 0 ){
               document.write(`${j}는 짝수입니다.<br>`);
               sum += j ;
            }else if(j % 2 == 1){
               document.write(`${j}는 홀수입니다.<br>`);
               sum_0 += j ;
            }
         }
         i++
      }

      document.write(`짝수의 합은 ${sum} 입니다.<br>`);
      document.write(`홀수의 합은 ${sum_0} 입니다.`);
      // j가 따로 저장 될 수 있는 이유
   </script>
</body>
</html>
