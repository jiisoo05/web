<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP통합 예제</title>
  <link rel="stylesheet" href="css/style01.css">
  <!-- GSAP 본체 -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <!-- ScrollTrigger 플러그인 -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <script src="js/gsap01.js"></script>
</head>

<body>
  <h1>GSAP 주요 기능 맛보기</h1>
  <!-- 1. 기본 to / from / fromTo -->
  <section class="fromTo">
    <h2>1. 기본 to / from / fromTo</h2>
    <div class="demo_area">
      <div class="box box_to">to</div>
      <div class="box box_from">from</div>
      <div class="box box_from_to">fromTo</div>
    </div>
  </section>
  <section>
    <h2>2.자주 쓰는 옵션</h2>
    <button id="btn_run">GO!</button>
    <div class="demo_area">
      <div class="dot"></div>
    </div>
  </section>

  <!-- 3. Stagger + ScrollTrigger -->
  <section>
    <h2>3. Stagger (스크롤시 착착착~)</h2>
    <ul class="chips">
      <li>🍎</li>
      <li>🍊</li>
      <li>🍌</li>
      <li>🍈</li>
      <li>🍇</li>
    </ul>
  </section>

  <!-- 4. Timeline + ScrollTrigger-->
  <section>
    <h2>4.Timeline 재생목록</h2>
    <div class="demo_area scene">
      <div class="card card1">1</div>
      <div class="card card2">2</div>
      <div class="card card3">3</div>
    </div>
  </section>

  <!-- 5.스타일 변화 -->
  <section>
    <h2>5.스타일/트랜스폼</h2>
    <div class="deom_area">
      <div class="hero">HELLO</div>
    </div>
  </section>

  <section>
    <h2>6. 토글 애니메이션</h2>
    <button id="btn_toggle">토글!</button>
    <div class="demo_area">
      <div class="panel">Panel</div>
    </div>
  </section>
</body>

</html>
