<!DOCTYPE html>

      <a href="https://chzzk.naver.com/8fd39bb8de623317de90654718638b10" target="_blank" rel="noopener noreferrer" aria-label="리코 치지직 (새 탭)" data-label="CHZZK">

    <div class="hero-copy">
      <p class="brand"><svg viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="brand" x2="0" y2="1"><stop stop-color="#9473e3"/><stop offset="1" stop-color="#7ca9f3"/></linearGradient></defs><circle cx="22" cy="22" r="21" fill="url(#brand)"/><path d="M8 27 18 15l6 10 12-13a17 17 0 0 1-28 20Z" fill="#f7f8e9"/><path d="m13 22 2.5 6 6 2.5-6 2.5L13 39l-2.5-6L5 30.5l5.5-2.5Z" fill="#fff"/></svg><span>STELLIVE</span></p>
      <h1>Yuzuha Riko</h1>
      <button class="meet-button" id="meet" type="button" aria-haspopup="dialog"><span class="button-label">Discover Riko</span><span class="button-arrow" aria-hidden="true">↘</span></button>
    </div>

    <footer class="hero-footer">
      <button class="motion-control" id="motion" type="button" aria-pressed="false" aria-label="물결 효과 끄기"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 10c3-5 5 5 9 0s6 5 9 0M3 16c3-5 5 5 9 0s6 5 9 0"/></svg><span>Water on</span></button>

      <small>UNOFFICIAL FAN PAGE</small>

    <span class="pointer-ring" aria-hidden="true"></span>

  <!-- Discover Riko 버튼으로 열리는 두 번째 화면. ESC 또는 닫기 버튼으로 돌아갑니다. -->
  <!-- 수면 아래로 잠기는 화면 전환. 장식용이라 읽기 순서에서 제외합니다. -->
  <div class="dive-transition" aria-hidden="true">
    <div class="dive-water">
      <svg class="dive-waterline" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 64 C160 18 270 104 440 58 S710 20 860 62 S1150 100 1440 40 L1440 120 L0 120Z" fill="#bcebdc"/></svg>

      <i class="dive-bubble one"></i><i class="dive-bubble two"></i><i class="dive-bubble three"></i>
    </div>
  </div>
  <dialog class="about" id="about" aria-labelledby="about-title">
    <button class="back-button" id="close" type="button">← <span>Back to the water</span></button>
    <div class="about-content">
      <p class="eyebrow">STELLIVE · YUZUHA RIKO</p>
      <h2 id="about-title">A fresh beginning.</h2>
      <p class="about-korean">오늘에 작은 용기를 더해줄,<br><strong>유즈하 리코.</strong></p>
      <p class="about-description">이세계의 마왕을 물리치고 세상을 구한 용사.<br>이제 스텔라이브에서 리코의 새로운 이야기를 만나보세요.</p>
      <div class="about-links">
        <a href="https://www.youtube.com/@yuzuhariko" target="_blank" rel="noopener noreferrer">YouTube <span>↗</span></a>
        <a href="https://chzzk.naver.com/8fd39bb8de623317de90654718638b10" target="_blank" rel="noopener noreferrer">Live on CHZZK <span>↗</span></a>
        <a href="https://stellive.me/riko" target="_blank" rel="noopener noreferrer">Official profile <span>↗</span></a>
      </div>
    </div>
    <p class="fan-note">팬이 만든 비공식 연습 페이지입니다. 공식 채널은 새 탭에서 열립니다.</p>
  </dialog>

</html>
