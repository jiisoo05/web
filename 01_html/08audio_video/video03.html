<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비디오 재생하기 - 풀페이지</title>
    <style>
    * {
      margin: 0;
      padding: 0;
    }

    figure {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #container {
      position: absolute;
      left: 100px;
      top: 100px;
      color: #fff;
    }
  </style>
</head>
<body>
    <figure>
      <video src="media/flower.mp4" id="bg" autoplay muted loop playsinline poster="images/flame.jpg"></video>
    </figure>
    <div id="container">
      <h2>Flower Video</h2>
    </div>
</body>
</html>
