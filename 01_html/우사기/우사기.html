<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 2048 게임</title>
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background: #171923;
    color: #f5f5f5;
    font-family: "Courier New", monospace;
}

.game {
    width: min(100%, 440px);
    padding: 20px;
    background: #252938;
    border: 4px solid #626b86;
    box-shadow: 8px 8px 0 #0c0d12;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

h1 {
    margin: 0;
    font-size: 54px;
    letter-spacing: -3px;
    color: #8cff98;
    text-shadow: 3px 3px 0 #277d56;
}

.scores {
    display: flex;
    gap: 8px;
}

.score-box {
    min-width: 78px;
    padding: 8px;
    border: 2px solid #626b86;
    background: #171923;
    color: #8cff98;
    text-align: center;
    font-weight: bold;
}

.score-box span {
    display: block;
    font-size: 11px;
}

.score-box strong {
    display: block;
    font-size: 20px;
}

.intro {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    line-height: 1.5;
}

.intro p {
    margin: 0;
    font-size: 13px;
}

button {
    border: 2px solid #8cff98;
    border-radius: 0;
    padding: 10px 12px;
    background: #277d56;
    color: white;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

button:hover {
    background: #3da96e;
    transform: translateY(-2px);
}

#board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 10px;
    border: 3px solid #626b86;
    background: #11131b;
    touch-action: none;
}

.cell {
    aspect-ratio: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid #41485d;
    background: #292e40;
    font-size: clamp(22px, 7vw, 36px);
    font-weight: bold;
    color: #ffffff;
}

.v2 {
    background: #e5e7eb;
    color: #252938;
}

.v4 {
    background: #a5d6a7;
    color: #17251a;
}

.v8 {
    background: #54c6a0;
    color: #102d25;
}

.v16 {
    background: #55c9e8;
    color: #102530;
}

.v32 {
    background: #4e91e8;
    color: white;
}

.v64 {
    background: #7768d9;
    color: white;
}

.v128,
.v256,
.v512 {
    background: #d66bd6;
    color: white;
    font-size: clamp(19px, 6vw, 30px);
}

.v1024,
.v2048 {
    background: #ffb84d;
    color: #332000;
    font-size: clamp(16px, 5vw, 26px);
    border: 3px solid #ffe18a;
    box-shadow: inset 0 0 8px #fff1b0;
}

.message {
    min-height: 24px;
    margin-top: 12px;
    text-align: center;
    font-weight: bold;
    color: #8cff98;
}

.help {
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.6;
    color: #b0b7ca;
}

@media (max-width: 380px) {
    .game {
        padding: 12px;
    }

    h1 {
        font-size: 42px;
    }

    .score-box {
        min-width: 65px;
        padding: 6px;
    }
}
/* 숫자가 바뀔 때 통통 튀는 효과 */
.cell.pop {
    animation: tile-pop 180ms cubic-bezier(0.2, 0.8, 0.3, 1.2);
}

@keyframes tile-pop {
    0% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.18);
    }

    100% {
        transform: scale(1);
    }
}
    </style>
</head>
<body>

    <div class="game">
        <header>
            <h1>2048</h1>

            <div class="scores">
                <div class="score-box">
                    <span>SCORE</span>
                    <strong id="score">0</strong>
                </div>

                <div class="score-box">
                    <span>BEST</span>
                    <strong id="best">0</strong>
                </div>
            </div>
        </header>

        <div class="intro">
            <p>숫자를 합쳐서 2048을 만들어 봐!</p>
            <button id="restart">NEW GAME</button>
        </div>

        <div id="board"></div>

        <div id="message" class="message"></div>

        <p class="help">
            HOW TO PLAY<br>
            방향키 ↑ ↓ ← → 로 숫자를 이동해 봐!
        </p>
    </div>

    <script>
// 게임 화면의 HTML 요소 가져오기
const boardElement = document.getElementById("board");
const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");

// 게임에 필요한 변수
let board = [];
let score = 0;
let previousBoard = null;
let best = Number(localStorage.getItem("2048-best") || 0);
let finished = false;


// 게임 시작 및 초기화
function startGame() {
    board = Array(4).fill(null).map(() => Array(4).fill(0));
    score = 0;
    finished = false;
    previousBoard = null;

    messageElement.textContent = "";

    addTile();
    addTile();
    drawBoard();
}
// 빈칸에 새로운 숫자 생성
function addTile() {
    const empty = [];

    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (board[r][c] === 0) {
                empty.push([r, c]);
            }
        }
    }

    if (empty.length === 0) return;

    const [r, c] = empty[
        Math.floor(Math.random() * empty.length)
    ];

    board[r][c] = Math.random() < 0.9 ? 2 : 4;
}


// 게임판 화면에 표시
function drawBoard() {
    boardElement.innerHTML = "";

    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            const value = board[r][c];
            const cell = document.createElement("div");

            cell.className = "cell" + (value ? " v" + value : "");
            cell.textContent = value || "";

            const oldValue = previousBoard
                ? previousBoard[r][c]
                : 0;

            if (value !== 0 && value !== oldValue) {
                cell.classList.add("pop");
            }

            boardElement.appendChild(cell);
        }
    }

    scoreElement.textContent = score;
    bestElement.textContent = best;

    // 현재 게임판 기억하기
    previousBoard = board.map(row => [...row]);
}
// 같은 숫자 합치기
function mergeLine(line) {
    let numbers = line.filter(value => value !== 0);
    const merged = [];

    for (let i = 0; i < numbers.length; i++) {
        if (numbers[i] === numbers[i + 1]) {
            const value = numbers[i] * 2;

            merged.push(value);
            score += value;

            i++;
        } else {
            merged.push(numbers[i]);
        }
    }

    while (merged.length < 4) {
        merged.push(0);
    }

    return merged;
}


// 방향키에 따라 숫자 이동
function move(direction) {
    if (finished) return;

    const before = JSON.stringify(board);

    for (let i = 0; i < 4; i++) {
        let line = [];

        for (let j = 0; j < 4; j++) {
            if (direction === "left") {
                line.push(board[i][j]);
            }

            if (direction === "right") {
                line.push(board[i][3 - j]);
            }

            if (direction === "up") {
                line.push(board[j][i]);
            }

            if (direction === "down") {
                line.push(board[3 - j][i]);
            }
        }

        line = mergeLine(line);

        for (let j = 0; j < 4; j++) {
            if (direction === "left") {
                board[i][j] = line[j];
            }

            if (direction === "right") {
                board[i][3 - j] = line[j];
            }

            if (direction === "up") {
                board[j][i] = line[j];
            }

            if (direction === "down") {
                board[3 - j][i] = line[j];
            }
        }
    }

    // 실제로 움직였을 때만 새 숫자 생성
    if (JSON.stringify(board) !== before) {
        addTile();

        best = Math.max(best, score);

        localStorage.setItem("2048-best", best);

        if (board.some(row => row.includes(2048))) {
            messageElement.textContent =
                "🎉 성공! 2048을 만들었어!";
        }
    }

    // 더 이상 움직일 수 없다면 게임 종료
    if (!canMove()) {
        finished = true;
        messageElement.textContent =
            "게임 오버! 다시 시작해서 도전해 봐.";
    }

    drawBoard();
}


// 움직일 수 있는지 확인
function canMove() {
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (board[r][c] === 0) return true;

            if (c < 3 && board[r][c] === board[r][c + 1]) {
                return true;
            }

            if (r < 3 && board[r][c] === board[r + 1][c]) {
                return true;
            }
        }
    }

    return false;
}


// 키보드 방향키 연결
document.addEventListener("keydown", event => {
    const keys = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down"
    };

    if (keys[event.key]) {
        event.preventDefault();
        move(keys[event.key]);
    }
});


// 다시 시작 버튼 연결
document.getElementById("restart")
    .addEventListener("click", startGame);


// 게임판을 마우스나 터치로 밀어서 이동
let startX = 0;
let startY = 0;

boardElement.addEventListener("pointerdown", event => {
    startX = event.clientX;
    startY = event.clientY;
});

boardElement.addEventListener("pointerup", event => {
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

    if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? "right" : "left");
    } else {
        move(dy > 0 ? "down" : "up");
    }
});


// 최고 점수 표시 후 게임 시작
bestElement.textContent = best;
startGame();
    </script>

</body>
</html>
