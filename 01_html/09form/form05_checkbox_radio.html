<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>radio checkbox</title>
</head>

<body>
  <form>
    <fieldset>
      <legend>신청 과목</legend>
      <p>uiux 툴 중에서 듣고 싶은 강의를 선택하세요 (1과목만 가능)</p>
      <!-- 라디오버튼은 여러개 중에서 하나만 선택하는 것이기 때문에 관련있는 그룹끼리는 name 속성값을 똑같이 만듭니다 -->
      <label><input type="radio" value="figma" name="uiux" checked>피그마</label>
      <label><input type="radio" value="photoshop" name="uiux">포토샵</label>
      <input type="radio" value="illust" name="uiux" id="illust">
      <label for="illust">일러스트</label>
    </fieldset>

    <fieldset>
      <legend>메일링</legend>
      <p>메일로 받고 싶은 uiux 주제를 선택해 주세요(복수선택 가능)</p>
      <label><input type="checkbox" value="uiux" checked>uiux</label>
      <label><input type="checkbox" value="design">design</label>
      <label><input type="checkbox" value="uiuxvideo">uiuxvideo</label>
      <label><input type="checkbox" value="ai활용">ai활용</label>
    </fieldset>   
  </form>
</body>

</html>
