<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테이블 만들기</title>
  <style>
    table,
    th,
    td {
      border: 1px solid #ccc;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 20px;
    }
  </style>
</head>

<body>
  <table>
    <caption>표의 구성 요소</caption>
    <tr>
      <th>주제</th>
      <th>태그</th>
      <th>비교</th>
    </tr>
    <tr>
      <th>테이블 구성 요소</th>
      <td>table</td>
      <td>테이블을 만드는 태그</td>
    </tr>
    <tr>
      <th>테이블 구성 요소</th>
      <td>tr</td>
      <td>테이블의 행을 만드는 태그</td>
    </tr>
    <tr>
      <th>테이블 구성 요소</th>
      <td>th</td>
      <td>테이블의 제목열을 만드는 태그</td>
    </tr>
    <tr>
      <th>테이블 구성 요소</th>
      <td>td</td>
      <td>테이블의 열을 만드는 태그</td>
    </tr>
  </table>
</body>

</html>
