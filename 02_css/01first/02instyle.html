      padding: 20px;
    }

    h2 {
      color: green;
    }

<body>
  <div id="container">
    <section>
      <h2>who am i?</h2>
      <p>
        프로덕트 디자인에 관심이 많습니다.<br>
        현재 강남 이젠아카데미에서 디자인 공부 중입니다.
      </p>
    </section>
  </div>

</html>
