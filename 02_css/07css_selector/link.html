<!DOCTYPE html>
<html lang="ko">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>link 스타일 - 가상클래스 선택자</title>
     <style>
          * {
               margin: 0;
               padding: 0;
          }

          .container {
               width: 960px;
               margin: 0 auto;
          }

          .navi ul {
               display: flex;
               list-style: none;
               height: 50px;
               background: #ccc;
               text-align: center;
               align-items: center;
          }

          .navi ul li {
               flex: 1;

          }

          /* 
            :link 방문하지 않은 링크에 스타일을 적용
            :vsited 방문한 링크에 스타일을 적용
           */

          .navi ul li a:link {
               color: red;
          }

          .navi ul li a:visited {
               color: green;
          }

            /* 
            :hover 웹 요소에 마우스 커서를 올려 놓을때의 스타일을 적용
            :focus 웹 요소에 초점이 맞추어 졌을때의 스타일 적용
            */

          .navi ul li a:hover,
          .navi ul li a:focus {
               background: #222;
               color: #fff;

          }

          /* :active 웹 요소를 활성화 했을 때의 스타일 적용 */
          .navi ul li a:active {
               background: yellow;
          }
     </style>
</head>

<body>
     <div class="container">
          <nav class="navi">
               <ul><a href="https://www.naver.com/" target="_blank">네이버</a></ul>
               <ul><a href="https://www.google.com/" target="_blank">구글</a></ul>
               <ul><a href="https://www.nate.com/" target="_blank">네이트</a></ul>
               <ul><a href="https://www.ezenac.co.kr/" target="_blank">이젠아카데미</a></ul>
          </nav>
     </div>
</body>

</html>
