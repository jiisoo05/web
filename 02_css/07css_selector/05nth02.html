<!DOCTYPE html>
<html lang="ko">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>nth-child</title>

          :root {
               font-size: 20px;
               --font-color: #333;
               --point-color1: red;
               --point-color1: blue;
               --point-color1: green;
          }

          ul {

          }

          a {

               text-decoration: none;
          }

</head>

<body>

               <li><a href="#">메뉴2</a></li>

               <li><a href="#">메뉴4</a></li>
               <li><a href="#">메뉴5</a></li>
               <li><a href="#">메뉴6</a></li>
               <li><a href="#">메뉴7</a></li>
               <li><a href="#">메뉴8</a></li>
          </ul>
     </nav>
</body>

</html>
