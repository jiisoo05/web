<!DOCTYPE html>
<html lang="ko">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>목록 스타일</title>
     <style>
          * {
               margin: 0;
               padding: 0;
          }

          ul,
          ol {
               width: 700px;
               margin: 0 auto;
               border: 1px solid #ccc;

          }

          ul {
               list-style-type: none;
               list-style: decimal-leading-zero inside;
          }

          ol {
               list-style-position: inside;
               list-style: upper-roman;
          }

          .img_ul {
               list-style-image: url(../Vector\ 1.png);
               list-style: url(../Vector\ 1.png) outside;
          }
     </style>


</head>

<body>

</body>

</html>
