<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>order</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
    }

    .flex_item:nth-child(1) {
      order: 3;
    }

    .flex_item:nth-child(2) {
      order: 2;
    }

    .flex_item:nth-child(3) {
      order: -3;
    }

    /* 배치순서 : 각 아이템들의 시각적 나열 순서를 결정하는 속성
        숫자 값이 들어가며, 작은 숫자일 수록 먼저 배치됨, 음수 가능,
        접근성 측면 고려하기
    */
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">AAAAAAAAAAAAAA</div>
    <div class="flex_item">BBB</div>
    <div class="flex_item">CCCCCCCCC</div>
  </div>
</body>

</html>
