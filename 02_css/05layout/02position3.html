<!DOCTYPE html>
<html lang="ko">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>css 포지셔닝</title>
     <style>
          * {
               margin: 0;
               padding: 0;
          }

          #wrap {
               width: 300px;
               height: 300px;
               border: 1px solid #333;
               margin: 0 auto;
               position: absolute;
          }

          .box {
               width: 50px;
               height: 50px;
               background: rgba(255, 0, 225, .8);
               text-align: center;
               line-height: 50px;
               border-radius: 50%;
               position: absolute;
          }

          .box1 {
               right: 0px;
               bottom: 0px;

          }

          .box2 {
               right: 0px;
               top: 0px;
          }

          .box3 {
               left: 0px;
               bottom: 0px;
          }

          .box4 {
               /* right: 125px;
               bottom: 125px; */
               top: 50%;
               right: 50%;
               margin-left: -25px;
               margin-right: -25px;
          }

          .box5 {
               bottom: 200px;
          }
     </style>
</head>

<body>
     <div id="wrap">
          <div class="box box1">박스1</div>
          <div class="box box2">박스2</div>
          <div class="box box3">박스3</div>
          <div class="box box4">박스4</div>
          <div class="box box5">박스5</div>
     </div>
</body>

</html>
