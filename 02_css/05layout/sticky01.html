<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sticky</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    header{
      width: 100%;
      height: 80px;
      background: red;
    }
    main{
      width: 100%;
      height: 1500px;
      background: blue;
    }
    .contents{
      width: 80%;
      height: 1200px;
      background: yellow;
      float: left;
    }
    aside{
      width: 18%;
      height: 300px;
      background: yellowgreen;
      float: right;
      position: sticky;
      top:0;
    }
    footer{
      width: 100%;
      height: 1000px;
      background: #333;
    }
  </style>
</head>

<body>
  <header>header</header>
  <main class="container">
    <section class="contents">
      <h2>contents</h2>
    </section>
    <aside>sidebar</aside>
  </main>
  <footer>footer</footer>
</body>

</html>
