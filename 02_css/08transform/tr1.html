<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition</title>
  <style>
    .tr1{
      width: 100px;
      height: 100px;
      background: blue;
      border:1px solid #000;
      transition-property: width,height;
      transition-duration: 2s,1s;
    }
    .tr1:hover{
      width: 200px;
      height: 150px;
      background: red;
    }
  </style>
</head>
<body>
    <div class="tr1"></div>
</body>
</html>
