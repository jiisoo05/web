<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>scale</title>
  <style>
    *{margin: 0; padding: 0;}
    ul{
      list-style: none;
      width: 640px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
    }
    ul li{
      width: 200px;
      height: 150px;
      overflow: hidden;
    }
    ul li a{
      display: block;
      width: 100%; height: 100%;
    }
    ul li a img{
      width: 100%; height: 100%;
      object-fit: cover;
      transition: .6s;
    }
    ul li:hover a img{
      transform: scale(1.2);
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="#"><img src="https://i.namu.wiki/i/02YJnimNDE1JBfX7kuKmU8albdCqcsvXGwT-cBO7BwVrfFKsiguPZtIH-ZLqFmctwUotBq_y0qJAd9a1XQ2mGw.webp" alt="변우석"></a></li>
    <li><a href="#"><img src="https://talkimg.imbc.com/TVianUpload/tvian/TViews/image/2025/09/04/e42c5234-20d1-489a-ac27-8a5717e07742.jpg" alt="변우석"></a></li>
    <li><a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6pgRpx9nlH_CO_1aw77GhKI2PNDlVRiz95yxuITHtwRUSIrK7vNymfKo&s=10" alt="변우석"></a></li>
  </ul>
</body>
</html>
