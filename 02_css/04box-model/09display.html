<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    div {
      margin: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    img {
      width: 300px;
    }

    #inline img:nth-child(2) {
      visibility: hidden;
    }

    #block img {
      display: block;
    }

    #block img:nth-child(2){
      display: none;
    }
    ul{
      width: 500px;
      margin: 0 auto;
      background: #ccc;
    }
    li{
      background: khaki;
      width: 100px;
      display: inline;
      display: inline-block;
    }
    a{
      color: inherit;
      text-decoration: none;
      background: lightcoral;
    }
  </style>
</head>

<body>
  <div id="inline">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnwl8Im-PxwfGtOyVJhicHVgpc2ZvU6ck0EA4Xdx5eMSm89AN8WP9zHY4&s=10"
      alt="변우석">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnwl8Im-PxwfGtOyVJhicHVgpc2ZvU6ck0EA4Xdx5eMSm89AN8WP9zHY4&s=10"
      alt="변우석">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnwl8Im-PxwfGtOyVJhicHVgpc2ZvU6ck0EA4Xdx5eMSm89AN8WP9zHY4&s=10"
      alt="변우석">
  </div>
  <div id="block">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnwl8Im-PxwfGtOyVJhicHVgpc2ZvU6ck0EA4Xdx5eMSm89AN8WP9zHY4&s=10"
      alt="변우석">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnwl8Im-PxwfGtOyVJhicHVgpc2ZvU6ck0EA4Xdx5eMSm89AN8WP9zHY4&s=10"
      alt="변우석">
    <img

      alt="변우석">

</body>

</html>
