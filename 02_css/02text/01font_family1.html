<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폰트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Black+Han+Sans&family=Gamja+Flower&display=swap"
    rel="stylesheet">
  <style>
    h2,
    p,
    h3 {
      font-size: 20px;
      font-weight: normal;
    }

    .w1 {
      font-family: "Gamja Flower", sans-serif;
    }

    .w2 {
      font-family: "Black Han Sans", sans-serif;
    }

    .w3 {
        font-family: "Bagel Fat One", system-ui;
    }
  </style>
</head>

<body>
  <h2>폰트 적용</h2>
  <h2 class="w1">웹폰트 적용</h2>
  <p>폰트 적용</p>
  <p class="w2">웹폰트 적용</p>
  <h3>폰트 적용</h3>
  <h3 class="w3">웹폰트 적용</h3>
</body>

</html>
