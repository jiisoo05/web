<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>font-weight</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css");

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
      font-size: 20px;
    }

    h2,
    strong,
    b {
      font-weight: normal;
    }

    em,
    i,
    address {
      font-style: normal;
    }

    h2 {
      font-size: 20px;
      font-weight: 100;
    }
    p{ font-weight: 200;}
    em{ font-weight: 300;}
    strong{ font-weight: 400;}
    i{ font-weight: 500;}
    b{ font-weight: 600;}
    span{ font-weight: 700;}
    div{ font-weight: 800;}
    address{ font-weight: 900;}
  </style>
</head>

<body>
  <h2>font-weight 속성</h2>
  <p>글자 굵기를 조절하는 속성</p>
  <em>em 태그 : 이탤릭체 강조 / </em>
  <strong>strong 태그 : 굵은 글씨 강조 / </strong>
  <i>i 태그 : 이탤릭체 / </i>
  <b>b 태그 : 굵은 글씨 / </b>
  <span>span 태그 : 인라인 묶어줄 때 </span>
  <div>div 태그 : 블록 묶어줄 때 </div>
  <address>웹사이트 관련 주소 넣을때 - 블록 , 이탤릭체</address>
</body>

</html>
