<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>font 속성</title>
  <style>
    @import url('https://www.bokbootlab.com/font-css/gmarket-sans.css');
    p{
      font:italic 800 30px/1.6 'GmarketSans', sans-serif;
    }
  </style>
</head>

<body>
  <h2>font 속성</h2>
  <p>글꼴 관련 속성을 한 번에 지정하는 단축 속성입니다.</p>
  <p>기본형: font: font-style font-variant font-weight font-stretch font-size/line-height font-family;</p>
</body>

</html>
