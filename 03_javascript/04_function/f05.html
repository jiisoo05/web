<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반환 값</title>
</head>

<body>
  <script>
    let result;
    function add(name, n) {
      document.write(`${name}학생이 1부터 ${n}까지 덧셈 수행<br>`);
      let sum = 0;
      for (let i = 1; i <= n; i++) {
        sum += i;
      }
      return sum;
    }
    result = add('변우석', 50);
    document.write('결과 : ' + result + '<br>');

    //연예인 학생이 1부터 1000까지 덧셈수행
    result = add('연예인', 1000);
    //결과 : 500500
    document.write('결과 : ' + result + '<br>');

    //이영희 학생이 1부터 100까지 덧셈수행
    document.write('결과 : ' + add('이영희',100) + '<br>');
  </script>
</body>

</html>
