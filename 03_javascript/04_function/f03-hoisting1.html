<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>함수 선언 방식 3종 - 선언문</title>
</head>
<body>
  <script>
    const text1 = '함수 선언 전 호출';
    const text2 = '함수 선언 후 호출';
    printMsg(text1);

    function printMsg(msg){
      document.write(`함수 호출 메시지 : ${msg}<br>`);
    }

    printMsg(text2);
    printMsg('불러보자');
  </script>
</body>
</html>
