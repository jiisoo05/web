<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>break continue 문</title>
</head>

<body>
  <script>
    for (let i = 1; i <= 10; i++) {
      if (i == 6) break;
      document.write(i + '<br>');
    }
    document.write('------continue--------<br>');
    for (let i = 1; i <= 10; i++) {
      if (i % 2 === 0) continue;
      document.write(i + '<br>');
    }
  </script>
</body>

</html>
