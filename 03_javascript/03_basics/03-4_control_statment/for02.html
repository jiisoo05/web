<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>for 반복문</title>
</head>

<body>
  <script>
    // 1~10까지의 합
    let sum = 0;
    for (let i = 1; i <= 10; i++) {
      sum += i;
      //console.log(i);
    }
    document.write(sum);
  </script>
</body>

</html>
