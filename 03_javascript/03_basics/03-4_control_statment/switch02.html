<!DOCTYPE html>
<html lang="ko">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>switch case 문</title>
</head>

<body>
     <script>
          const site = prompt('네이버,다음,네이트,구글 중 즐겨 사용하는 포털 사이트는? (한글로 입력)');
          let url;
          switch (site) {
               case '네이버': url = 'https://www.naver.com/';
                    break;
               case '다음': url = 'https://www.daum.net/';
                    break;
               case '네이트': url = 'https://www.nate.com/';
                    break;
               case '구글': url = 'https://www.google.com/?hl=ko';
                    break;
                    default : alert('보기중에 없는 사이트 입니다');
          }
          // console.log(url);
          location.href = url;
     </script>
</body>

</html>
