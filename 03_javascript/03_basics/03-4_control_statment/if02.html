<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>if</title>
</head>

<body>
  <script>
    if (1 < 0) {
      document.write('참 일때 실행');
    } else {
      document.write('거짓일 때 실행');
    }
    if (0) {
      document.write('1참 일때 실행');
    } else {
      document.write('1거짓일 때 실행');
    }
  </script>
</body>

</html>
