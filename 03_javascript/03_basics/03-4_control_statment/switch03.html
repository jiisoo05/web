<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요일별 일정을 알려주는 프로그램 만들기</title>
</head>

<body>
  <script>
    let text;
    let week = new Date().getDay();
    switch (week) {
      case 1:
      case 2: text = 'html5';
        break;
      case 3:
      case 4: text = 'css3';
        break;
      case 5:
      case 6: text = 'javascript';
        break;
      default : text = '노는 것을'  
    }
    document.write(`오늘은 <b>${text}</b> 학습하는 날입니다`);
  </script>
</body>

</html>
