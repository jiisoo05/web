<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100~200 5의배수 찍기</title>
</head>

<body>
  <script>
    for (let i = 100; i <= 200; i++) {
      if (i % 5 == 0) {
        document.write(i + '<br>');
      }
    }
  </script>
</body>

</html>
