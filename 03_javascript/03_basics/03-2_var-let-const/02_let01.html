<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>let</title>
</head>

<body>
  <script>
    let num1 = 10; //변수 선언과 동시에 값을 할당 -> 초기값 -> 초기화
    console.log(num1);
    num1 = 20;
    console.log(num1);
    num1 = '최율희';
    console.log(num1);

    let str1; //변수 선언
    console.log(str1);
    str1 = '최율희'
    document.write(str1);
    /*
    ecma6문법
    var는 동일한 변수를 중복해서 선언할 수 있지만
    let은 이미 선언한 변수를 중복해서 선언할 수 없다.
    var와 let은 앞으로 학습할 제어문이나 함수의 블록{}에서도 차이점이 있다.
    */
  </script>
</body>

</html>
